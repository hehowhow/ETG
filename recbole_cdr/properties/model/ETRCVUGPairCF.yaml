etrc_lambda_min: 0.0
etrc_lambda_max: 1.0
etrc_lambda_base: 0.0
etrc_gate_temperature: 1.0
etrc_harmful_penalty: 0.5

etrc_noharm_weight: 0.0
etrc_tgf_weight: 0.0
etrc_noharm_margin: 0.0
etrc_tgf_margin: 0.0

etrc_crossfit_delta_path: ~
etrc_crossfit_missing_strategy: skip
etrc_crossfit_supervise_positive_only: True
